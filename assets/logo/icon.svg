<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- lakebrasil icon: stacked data-lake strata in BR colors
       4 horizontal bars of decreasing width (top-heavy wedge),
       each representing a data layer in the lakehouse.
       Colors: deep forest green → warm yellow → river blue → deep iceberg blue. -->
  <title>lakebrasil</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a8754"/>
      <stop offset="100%" stop-color="#0d9963"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4c542"/>
      <stop offset="100%" stop-color="#e8b03a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b9ed4"/>
      <stop offset="100%" stop-color="#2d7eb0"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4e8c"/>
      <stop offset="100%" stop-color="#143962"/>
    </linearGradient>
  </defs>

  <!-- 4 stacked strata, each row is a "data layer" -->
  <rect x="16"  y="22"  width="96" height="16" rx="2" fill="url(#g1)"/>
  <rect x="24"  y="44"  width="80" height="16" rx="2" fill="url(#g2)"/>
  <rect x="32"  y="66"  width="64" height="16" rx="2" fill="url(#g3)"/>
  <rect x="40"  y="88"  width="48" height="16" rx="2" fill="url(#g4)"/>
</svg>
