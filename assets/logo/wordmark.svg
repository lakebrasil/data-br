<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" width="480" height="128">
  <!-- lakebrasil wordmark: icon + text horizontal layout -->
  <title>lakebrasil</title>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a8754"/><stop offset="100%" stop-color="#0d9963"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4c542"/><stop offset="100%" stop-color="#e8b03a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b9ed4"/><stop offset="100%" stop-color="#2d7eb0"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4e8c"/><stop offset="100%" stop-color="#143962"/>
    </linearGradient>
  </defs>

  <!-- Icon (left, scaled to 96x96 at x=16) -->
  <g transform="translate(16, 16)">
    <rect x="0"  y="4"  width="96" height="16" rx="2" fill="url(#g1)"/>
    <rect x="8"  y="26" width="80" height="16" rx="2" fill="url(#g2)"/>
    <rect x="16" y="48" width="64" height="16" rx="2" fill="url(#g3)"/>
    <rect x="24" y="70" width="48" height="16" rx="2" fill="url(#g4)"/>
  </g>

  <!-- Wordmark (right) -->
  <text x="136" y="82"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="64" font-weight="700"
        fill="#143962" letter-spacing="-2">
    lake<tspan fill="#0a8754">brasil</tspan>
  </text>
</svg>
