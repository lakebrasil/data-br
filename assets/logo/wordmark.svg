<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128">
  <title>lakebrasil</title>
  <defs>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16c47e"/><stop offset="100%" stop-color="#0a8754"/>
    </linearGradient>
    <linearGradient id="g-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd566"/><stop offset="100%" stop-color="#e8b03a"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb8e8"/><stop offset="100%" stop-color="#2d7eb0"/>
    </linearGradient>
    <linearGradient id="g-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c66a8"/><stop offset="100%" stop-color="#143962"/>
    </linearGradient>
    <clipPath id="ice-wm">
      <path d="M 56 16 L 100 104 L 12 104 Z"/>
    </clipPath>
  </defs>

  <!-- Icon (left) -->
  <g clip-path="url(#ice-wm)">
    <rect x="0" y="16"  width="120" height="22" fill="url(#g-green)"/>
    <rect x="0" y="38"  width="120" height="22" fill="url(#g-yellow)"/>
    <rect x="0" y="60"  width="120" height="22" fill="url(#g-blue)"/>
    <rect x="0" y="82"  width="120" height="22" fill="url(#g-navy)"/>
  </g>
  <g clip-path="url(#ice-wm)" stroke="#ffffff" stroke-width="1" stroke-opacity="0.85">
    <line x1="0" y1="38" x2="120" y2="38"/>
    <line x1="0" y1="60" x2="120" y2="60"/>
    <line x1="0" y1="82" x2="120" y2="82"/>
  </g>

  <!-- Wordmark (right) -->
  <text x="138" y="82"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="64" font-weight="700"
        fill="#143962" letter-spacing="-2">
    lake<tspan fill="#0a8754">brasil</tspan>
  </text>
</svg>
