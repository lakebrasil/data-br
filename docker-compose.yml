# 100% open-source local dev stack — MinIO (S3) + Nessie (Iceberg REST catalog).
# Zero AWS. Roda com `docker compose up -d`.
#
# Host ports — escolhidos pra evitar colisão com daemons locais comuns:
#   MinIO API     → 9100  (S3 endpoint)
#   MinIO Console → 9101
#   Nessie        → 19120
#
# Depois, no shell:
#
#   export ICEBERG_WAREHOUSE=warehouse
#   export ICEBERG_REST_ENDPOINT=http://localhost:19120/iceberg/
#   export S3_ENDPOINT_URL=http://localhost:9100
#   export AWS_ACCESS_KEY_ID=minioadmin
#   export AWS_SECRET_ACCESS_KEY=minioadmin
#   export AWS_REGION=us-east-1
#
#   pip install -e ./pipelines
#   lakebrasil run anp_precos --no-fetch
#
# Console MinIO: http://localhost:9101  (user: minioadmin / pass: minioadmin)
# Console Nessie: http://localhost:19120
services:
  minio:
    image: minio/minio:latest
    container_name: lakebrasil-minio
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create the 'warehouse' bucket on startup (idempotent)
  minio-init:
    image: minio/mc:latest
    container_name: lakebrasil-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/warehouse;
      mc mb --ignore-existing local/data-br-raw;
      mc anonymous set public local/warehouse;
      mc anonymous set public local/data-br-raw;
      echo 'minio buckets ready: warehouse, data-br-raw';
      "

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakebrasil-nessie
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "19120:19120"  # REST API + UI
    environment:
      # Iceberg REST API (Nessie's modern interface)
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.region: us-east-1
      # endpoint = Nessie → MinIO (inside docker network)
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      # external-endpoint = vended back to clients (reachable from host)
      nessie.catalog.service.s3.default-options.external-endpoint: http://localhost:9100/
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      # MinIO credentials — URN points to a quarkus config-path secret (full path).
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: minioadmin
      nessie.catalog.secrets.access-key.secret: minioadmin
      nessie.server.authentication.enabled: "false"

volumes:
  minio-data:
