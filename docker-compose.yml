# 100% open-source local dev stack — MinIO (S3) + Nessie (Iceberg REST catalog).
# Zero AWS. Roda com `docker compose up -d`.
#
# Depois, no shell:
#
#   export ICEBERG_WAREHOUSE=s3://warehouse/
#   export ICEBERG_REST_ENDPOINT=http://localhost:19120/iceberg/v1
#   export S3_ENDPOINT_URL=http://localhost:9000
#   export AWS_ACCESS_KEY_ID=minioadmin
#   export AWS_SECRET_ACCESS_KEY=minioadmin
#   export AWS_REGION=us-east-1
#
#   pip install -e ./pipelines
#   lakebrasil run anp_precos --no-fetch
#
# Console MinIO: http://localhost:9001  (user: minioadmin / pass: minioadmin)
# Console Nessie: http://localhost:19120
services:
  minio:
    image: minio/minio:latest
    container_name: lakebrasil-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: minio
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Create the 'warehouse' bucket on startup (idempotent)
  minio-init:
    image: minio/mc:latest
    container_name: lakebrasil-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/warehouse;
      mc anonymous set public local/warehouse;
      echo 'minio bucket warehouse ready';
      "

  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: lakebrasil-nessie
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "19120:19120"  # REST API + UI
    environment:
      # Use Iceberg REST API (Nessie's modern interface)
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:minio-creds
      nessie.catalog.secrets.minio-creds.name: minioadmin
      nessie.catalog.secrets.minio-creds.secret: minioadmin
      nessie.server.authentication.enabled: "false"

volumes:
  minio-data:
