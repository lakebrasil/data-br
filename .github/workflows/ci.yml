name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        working-directory: ./pipelines
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: ./pipelines
        run: ruff check .
      - name: pytest
        working-directory: ./pipelines
        run: pytest tests/ -v
